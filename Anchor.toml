[toolchain]
anchor_version = "1.0.2"

[features]
resolution = true
skip-lint = false

[programs.devnet]
safenudge = "GxruFdaFHYPv9MqhFM2MoFWyYNXGnmhdTpy1MFHXJSUc"

# Mainnet (issue #20). Upgrade authority: the Squads vault 3M4JicDnPbSbXboGW8Wz7DyDGTTAFqH27TseSTzAQ3PX.
# Build with `anchor build --ignore-keys -- --features mainnet` and check that
# target/idl/safenudge.json has this address. Never run `anchor keys sync`: it
# rewrites declare_id! to a local keypair. Deploy with `solana program deploy`
# and hand the upgrade authority to the Squad vault in the next transaction
# (ARCHITECTURE.md, "Mainnet deploy"), never with `anchor deploy`.
[programs.mainnet]
safenudge = "98poy9z9Z2MTz2TXW5W2LfnWosRubJYLbNzAjCYZeYFc"

# anchor-litesvm's fromWorkspace() hard-codes a lookup of programs.localnet,
# so this block must stay present for the in-process test suite to load. The
# program ID is the same as the devnet entry above.
[programs.localnet]
safenudge = "GxruFdaFHYPv9MqhFM2MoFWyYNXGnmhdTpy1MFHXJSUc"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "npx ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
