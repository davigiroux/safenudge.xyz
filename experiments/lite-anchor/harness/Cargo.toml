[package]
name = "harness"
version = "0.1.0"
edition = "2021"
publish = false
description = "Runs the Anchor and lite-anchor builds of deposit side by side in LiteSVM"

[dependencies]

[dev-dependencies]
base64 = "0.22"
litesvm = "0.18"
sha2 = "0.10"
solana-account = "4.3"
solana-address = { version = "2.7", features = ["curve25519", "decode"] }
solana-clock = "3.2"
solana-instruction = "3.5"
solana-instruction-error = "2.5"
solana-keypair = "3.1.2"
solana-message = "4.2.4"
solana-signer = "3.0.1"
solana-transaction = "4.1.5"
solana-transaction-error = "3.4"
