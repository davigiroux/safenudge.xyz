name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Anchor 1.0.x ships its own bundled cargo-build-sbf with current Rust, so
  # we no longer need to pin a Solana CLI for the SBF toolchain. We still
  # install one so the runner can run `solana-keygen new` and `anchor` can
  # find it on PATH if it ever shells out (the test path uses LiteSVM, an
  # in-process VM, instead of any RPC).
  SOLANA_VERSION: v3.1.10
  ANCHOR_VERSION: 1.0.2
  # Node 24 to match the dev's local toolchain. Node 20 and Node 22 both
  # ship a V8 with a `PretenuringHandler::ProcessPretenuringFeedback` bug
  # where the allocation-site hash table fails to rehash under this
  # test suite's load, killing the process with `std::bad_alloc`
  # mid-suite. Node 24's V8 12.9+ does not exhibit it.
  NODE_VERSION: 24

jobs:
  program:
    name: Anchor build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # Denies the `[lints.clippy]` set in programs/safenudge/Cargo.toml: raw
      # arithmetic and lossy `as` casts (CLAUDE.md "Forbidden patterns"). Runs
      # before the toolchain installs so a violation fails early. The devnet
      # pass covers code behind `#[cfg(feature = "devnet")]`.
      - name: Clippy arithmetic and cast lints
        run: |
          cargo clippy -p safenudge
          cargo clippy -p safenudge --features devnet
          cargo clippy -p safenudge --features mainnet

      # Pins the mainnet program ID and timing constants
      # (`mainnet_build_tests` in lib.rs).
      - name: Mainnet build unit tests
        run: cargo test -p safenudge --lib --features mainnet

      - name: Cache Solana install
        uses: actions/cache@v4
        with:
          path: ~/.local/share/solana/install
          key: ${{ runner.os }}-solana-${{ env.SOLANA_VERSION }}

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/${{ env.SOLANA_VERSION }}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor CLI
        # Skip avm — it can fail to bootstrap on a fresh runner. Install
        # anchor-cli directly at the pinned tag with --locked so cargo uses
        # Anchor's bundled Cargo.lock.
        run: |
          cargo install --git https://github.com/coral-xyz/anchor \
            --tag v${{ env.ANCHOR_VERSION }} \
            anchor-cli --locked --force

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install workspace dev deps
        run: npm install --no-audit --no-fund

      - name: Generate keypair for builds
        run: |
          mkdir -p ~/.config/solana
          solana-keygen new --no-bip39-passphrase --silent --outfile ~/.config/solana/id.json

      # The mainnet artifact must carry the mainnet program ID. Built before
      # the default build so the tests below load the default .so.
      - name: Mainnet build carries the mainnet program ID
        run: |
          anchor build --ignore-keys -- --features mainnet
          test "$(node -p "require('./target/idl/safenudge.json').address")" = "98poy9z9Z2MTz2TXW5W2LfnWosRubJYLbNzAjCYZeYFc"

      # `--ignore-keys` because anchor 1.0 generates a fresh program keypair
      # on first build that does not match the `declare_id!()` baked into
      # the source. The mismatch is benign for our LiteSVM tests, which
      # load the .so at the address `declare_id!()` declares.
      - run: anchor build --ignore-keys

      # SafePool and the monitoring bundle copy idl/ from this repo, so it must
      # be the IDL this commit builds.
      - name: Committed IDL matches the build
        run: |
          diff -u idl/safenudge.json target/idl/safenudge.json
          diff -u idl/safenudge-types.ts target/types/safenudge.ts

      - name: Run integration tests (LiteSVM, in-process)
        run: npx ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts

  security-lint:
    name: Security lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for sensitive values in committed code
        run: |
          set -e
          if grep -rn --include="*.ts" --include="*.tsx" --include="*.rs" --include="*.toml" \
               -E 'ramp_live_|sk_live_|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----' \
               programs/ ops/ scripts/ tests/ 2>/dev/null; then
            echo "ERROR: Sensitive value detected in source code."
            exit 1
          fi
          echo "No sensitive value suspects."

  audit:
    name: Dependency audits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Audits are advisory: a known CVE in a transitive dep should be visible
      # in the logs but must not fail the PR. Using `continue-on-error` at the
      # step level (rather than the job level) keeps the job's conclusion as
      # success while preserving the per-step output so advisories show up in
      # the workflow run summary.
      - name: cargo audit
        continue-on-error: true
        run: |
          cargo install cargo-audit --locked
          cargo audit
      - name: npm audit
        continue-on-error: true
        run: npm audit --omit=dev
