# Copy this file to .github/workflows/bipline.yml in your target repo.
# Required secrets: BUFFER_API_KEY, ANTHROPIC_API_KEY
# Required vars: BUFFER_ORG_ID
name: bipline

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: davigiroux/bipline
          path: bipline

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: bipline/go.mod

      - name: Restore idempotency cache
        id: cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .bipline-cache
          key: bipline-${{ github.event.release.tag_name }}

      - name: Run bipline
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: bipline
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BUFFER_ORG_ID: ${{ vars.BUFFER_ORG_ID }}
          BIPLINE_VOICE_PATH: ./voice.md
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: go run ./cmd/bipline/

      - name: Mark processed
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: mkdir -p .bipline-cache && echo "ok" > ".bipline-cache/$TAG_NAME"
