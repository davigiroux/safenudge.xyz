[package]
name = "safenudge"
version = "0.1.0"
description = "Group accountability savings protocol on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "safenudge"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
mainnet = []
devnet = []

[dependencies]
anchor-lang = "1.0.2"
anchor-spl = "1.0.2"

# Enforces the CLAUDE.md arithmetic rule. CI runs `cargo clippy -p safenudge`.
[lints.clippy]
arithmetic_side_effects = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
